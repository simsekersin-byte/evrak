<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evrak Defterim</title>
<meta name="theme-color" content="#1f5f8b">
<meta name="description" content="Öğretmen evraklarını telefonda hazırlayan çevrimdışı uygulama">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f8; --kart:#fff; --yazi:#1d2430; --soluk:#5d6878; --ana:#1f5f8b; --ana2:#174a6d;
  --cizgi:#d8dee6; --uyari:#b4541a; --iyi:#2c7a4b; --golge:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.ust{position:sticky;top:0;z-index:5;background:var(--ana);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
header.ust h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.ust button{background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px;line-height:1}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.kart{background:var(--kart);border-radius:12px;box-shadow:var(--golge);padding:14px;margin-bottom:12px}
.kart h2{font-size:17px;margin:0 0 8px}
.kart p{margin:4px 0;color:var(--soluk);font-size:14px}
.izgara{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evrak{display:block;text-align:left;width:100%;border:1px solid var(--cizgi);background:var(--kart);border-radius:12px;padding:14px 12px;font:inherit;color:inherit;box-shadow:var(--golge)}
.evrak b{display:block;font-size:15px;margin-bottom:2px}
.evrak span{font-size:13px;color:var(--soluk)}
.evrak .sim{font-size:26px;display:block;margin-bottom:6px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
label small{font-weight:400;color:var(--soluk)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--cizgi);border-radius:8px;background:#fff;color:var(--yazi)}
textarea{min-height:110px;resize:vertical}
textarea.uzun{min-height:200px}
.satir{display:flex;gap:10px}.satir>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;background:var(--ana);color:#fff;cursor:pointer}
.btn:active{background:var(--ana2)}
.btn.ikincil{background:#e4ebf2;color:var(--ana2)}
.btn.tehlike{background:#f6e3d8;color:var(--uyari)}
.btn.tam{width:100%}
.butonlar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.butonlar .btn{flex:1 1 140px}
.alt{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--cizgi);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
.alt .btn{flex:1}
.ipucu{font-size:13px;color:var(--soluk);margin-top:4px}
.etiket{display:inline-block;background:#e4ebf2;color:var(--ana2);border-radius:6px;padding:1px 6px;margin:2px 2px 0 0;font-size:12px;font-family:ui-monospace,monospace}
.bildirim{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.bildirim.acik{opacity:1}
details summary{cursor:pointer;font-weight:600;color:var(--ana2);margin-top:10px}
.sayac{font-size:13px;color:var(--iyi);font-weight:600}
/* Kağıt önizleme */
.kagit-kap{overflow-x:auto;background:#cfd6de;border-radius:12px;padding:12px}
.kagit{background:#fff;color:#000;width:100%;max-width:700px;margin:0 auto;padding:28px 26px;font-family:"Times New Roman",Times,serif;font-size:14px;line-height:1.35;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.kagit .b-baslik{text-align:center;font-weight:bold;margin:0}
.kagit p{margin:0 0 6px}
.kagit .b-h{font-weight:bold;margin-top:10px}
.kagit .b-madde{padding-left:1.4em;text-indent:-1.4em}
.kagit table{width:100%;border-collapse:collapse;margin:6px 0 10px}
.kagit table.cerceve td,.kagit table.cerceve th{border:1px solid #000;padding:3px 5px;vertical-align:top}
.kagit table.cerceve th{font-weight:bold;background:#f0f0f0}
.kagit table.imza td{text-align:center;vertical-align:top;padding:4px 4px 14px}
.kagit table.plan td{text-align:center;vertical-align:middle;height:46px;font-size:12px}
.kagit .bosluk{height:12px}
.kagit .sayfa-sonu{border-top:2px dashed #bbb;margin:18px -26px}
.kagit.yatay{max-width:none;font-size:11px}
.kagit.yatay table.cerceve td,.kagit.yatay table.cerceve th{padding:2px 3px;font-size:10px}
/* Oturma planı düzenleyici */
.plan-duz{display:grid;gap:8px;margin-top:10px}
.sira{display:flex;gap:4px;border:1px solid var(--cizgi);border-radius:8px;padding:4px;background:#fafbfc}
.koltuk{flex:1;min-width:0;border:1px solid var(--cizgi);background:#fff;border-radius:6px;padding:6px 2px;font-size:11px;line-height:1.2;min-height:44px;text-align:center;word-break:break-word}
.koltuk.secili{outline:3px solid var(--uyari)}
.koltuk.bos{color:#aab}
.tahta{text-align:center;font-size:12px;font-weight:700;background:#2f4f3f;color:#fff;border-radius:6px;padding:4px}
@media print{
  @page{size:A4;margin:15mm}
  body{background:#fff}
  header.ust,.alt,.yazdirma-yok,.bildirim{display:none!important}
  main{padding:0;max-width:none}
  .kagit-kap{background:none;padding:0;overflow:visible}
  .kagit{box-shadow:none;padding:0;max-width:none;font-size:12pt}
  .kagit table.plan td{height:15mm;font-size:10pt}
  tr{page-break-inside:avoid}
  .kagit .sayfa-sonu{border:0;margin:0;break-after:page}
  .kagit.yatay table.cerceve td,.kagit.yatay table.cerceve th{font-size:7.5pt}
}
</style>
</head>
<body>
<header class="ust">
  <button id="geri" aria-label="Geri" hidden>&#8592;</button>
  <h1 id="baslik">Evrak Defterim</h1>
  <button id="yukleBtn" hidden style="font-size:14px;border:1px solid #fff;border-radius:8px">Yükle</button>
</header>
<main id="ekran"></main>
<div class="bildirim" id="bildirim"></div>

<script>
"use strict";
/* =========================================================
   VERİ: her şey bu telefonda, localStorage'da durur.
   ========================================================= */
const ANAHTAR = "evrakDefterim.v1";
const BOS = {
  okul:{okul:"",il:"",ilce:"",yil:"2026-2027",mudur:"",mudurYrd:"",rehber:"",ogretmen:"",brans:"Matematik",sube:"9/C"},
  zumre:[], subeOgretmen:[], ogrenciler:[], siniflar:["9/C","10/C"], yillik:{}, sablonlar:{}, kayitlar:{}, kurulumTamam:false
};
let S;
try{ S = Object.assign(structuredClone(BOS), JSON.parse(localStorage.getItem(ANAHTAR)||"{}")); }catch(e){ S = structuredClone(BOS); }
S.okul = Object.assign({}, BOS.okul, S.okul);
function kaydet(){ try{ localStorage.setItem(ANAHTAR, JSON.stringify(S)); }catch(e){ bildir("Kaydedilemedi: telefon hafızası dolu olabilir."); } }

/* ---------- yardımcılar ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BUYUK = s=>String(s??"").toLocaleUpperCase("tr-TR");
const bugun = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function trTarih(iso){ if(!iso) return "..../..../20...."; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y}`; }
const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
function gunAdi(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return GUNLER[new Date(y,m-1,d).getDay()]; }
let bildirimZaman;
function bildir(m){ const b=$("#bildirim"); b.textContent=m; b.classList.add("acik"); clearTimeout(bildirimZaman); bildirimZaman=setTimeout(()=>b.classList.remove("acik"),2600); }
const satirlar = s=>String(s||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const paragraflar = s=>String(s||"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
function normAnahtar(k){ return BUYUK(k).replace(/İ/g,"I").replace(/Ş/g,"S").replace(/Ğ/g,"G").replace(/Ü/g,"U").replace(/Ö/g,"O").replace(/Ç/g,"C").replace(/\s+/g,"_"); }
function dosyaAdi(s){ return String(s).replace(/ı/g,"i").replace(/İ/g,"I").replace(/ş/g,"s").replace(/Ş/g,"S").replace(/ğ/g,"g").replace(/Ğ/g,"G").replace(/ü/g,"u").replace(/Ü/g,"U").replace(/ö/g,"o").replace(/Ö/g,"O").replace(/ç/g,"c").replace(/Ç/g,"C").replace(/[^A-Za-z0-9._-]+/g,"_"); }
function ogrAd(o){ return o ? o.ad : ""; }

/* ---------- yer tutucular {OKUL} {TARIH} ... ---------- */
function baglam(v={}){
  const o=S.okul, og=S.ogrenciler;
  return {
    OKUL:o.okul, IL:o.il, ILCE:o.ilce, YIL:o.yil, MUDUR:o.mudur, MUDUR_YRD:o.mudurYrd, REHBER:o.rehber,
    OGRETMEN:o.ogretmen, BRANS:o.brans, SUBE:v.sinif||o.sube, DERS:o.brans,
    MEVCUT:og.length, KIZ:og.filter(x=>x.cins==="K").length, ERKEK:og.filter(x=>x.cins==="E").length,
    TARIH:trTarih(v.tarih), GUN:gunAdi(v.tarih), SAAT:v.saat||"", YER:v.yer||"", DONEM:v.donem||"",
    TOPLANTI:v.toplanti||"", BASKAN:v.baskan||o.ogretmen, VELI_SAYISI:v.veliSayisi||"....",
    ZUMRE:(S.zumre.length?S.zumre.join(", "):o.ogretmen)
  };
}
function doldur(metin,b){ return String(metin??"").replace(/\{([^{}]+)\}/g,(m,k)=>{ const n=normAnahtar(k); return (n in b && b[n]!=="" && b[n]!=null) ? b[n] : m; }); }
const YER_TUTUCULAR=["OKUL","IL","ILCE","YIL","MUDUR","MUDUR_YRD","REHBER","OGRETMEN","BRANS","SUBE","MEVCUT","KIZ","ERKEK","TARIH","GUN","SAAT","YER","DONEM","TOPLANTI","BASKAN","VELI_SAYISI","ZUMRE"];

/* =========================================================
   BELGE MODELİ: bloklar → hem önizleme (HTML) hem Word (.docx)
   ========================================================= */
const B = {
  baslik:(...s)=>s.filter(Boolean).map(t=>({t:"baslik",text:t})),
  p:(text,o={})=>({t:"p",text,...o}),
  h:text=>({t:"h",text}),
  madde:(no,text)=>({t:"madde",no,text}),
  tablo:(rows,o={})=>({t:"tablo",rows,...o}),
  imza:(kisiler,sutun=3)=>({t:"imza",kisiler,sutun}),
  bosluk:()=>({t:"bosluk"}),
  sayfa:()=>({t:"sayfa"})
};
function ustBaslik(b, ad){ return B.baslik(BUYUK(b.YIL+" EĞİTİM-ÖĞRETİM YILI"), BUYUK(b.OKUL||"............ OKULU")+" MÜDÜRLÜĞÜ", BUYUK(ad)); }
function bilgiTablosu(cift){ return B.tablo(cift.map(([a,c])=>[{text:a,bold:true},c]),{genislik:[30,70]}); }
function maddeler(liste){ return liste.map((x,i)=>B.madde((i+1)+".",x.replace(/^\d+[.)-]\s*/,""))); }
function gruplu(kisiler,n){ const r=[]; for(let i=0;i<kisiler.length;i+=n) r.push(kisiler.slice(i,i+n)); return r; }
function onay(b,tarih){ return B.imza([{ust:"UYGUNDUR", ad:b.MUDUR||"................", unvan:"Okul Müdürü", alt:trTarih(tarih)}],1); }

/* ---------- HTML önizleme ---------- */
function htmlCiz(bloklar){
  return bloklar.map(k=>{
    const tx=s=>esc(s).replace(/\n/g,"<br>");
    switch(k.t){
      case "baslik": return `<p class="b-baslik">${tx(k.text)}</p>`;
      case "p": return `<p style="text-align:${k.hiza||"justify"};${k.bold?"font-weight:bold;":""}${k.girinti?"text-indent:1.25cm;":""}">${tx(k.text)}</p>`;
      case "h": return `<p class="b-h">${tx(k.text)}</p>`;
      case "madde": return `<p class="b-madde">${esc(k.no)} ${tx(k.text)}</p>`;
      case "bosluk": return `<div class="bosluk"></div>`;
      case "sayfa": return `<div class="sayfa-sonu"></div>`;
      case "tablo": {
        const g=k.genislik?`<colgroup>${k.genislik.map(w=>`<col style="width:${w}%">`).join("")}</colgroup>`:"";
        const sinif=k.plan?"cerceve plan":"cerceve";
        return `<table class="${sinif}">${g}${k.rows.map((r,i)=>`<tr>${r.map(c=>{const o=typeof c==="object"&&c?c:{text:c}; const tag=(k.baslikSatiri&&i===0)?"th":"td"; return `<${tag}${o.colspan?` colspan="${o.colspan}"`:""} style="${o.bold?"font-weight:bold;":""}${o.hiza?`text-align:${o.hiza};`:""}${o.dolgu?"background:#e8e8e8;":""}">${tx(o.text)}</${tag}>`;}).join("")}</tr>`).join("")}</table>`;
      }
      case "imza": return `<table class="imza">${gruplu(k.kisiler,k.sutun).map(r=>`<tr>${r.map(p=>`<td style="width:${100/k.sutun}%">${p.ust?`<b>${esc(p.ust)}</b><br>`:""}${p.alt&&p.ust?esc(p.alt)+"<br>":""}<br>${esc(p.ad||"................")}<br>${esc(p.unvan||"")}</td>`).join("")}</tr>`).join("")}</table>`;
    }
    return "";
  }).join("");
}

/* ---------- Word (.docx) üretimi: kütüphanesiz ---------- */
const xe = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function run(text,{bold,size}={}){
  const rpr=(bold||size)?`<w:rPr>${bold?"<w:b/>":""}${size?`<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`:""}</w:rPr>`:"";
  return String(text??"").split("\n").map((l,i)=>`${i?`<w:r>${rpr}<w:br/></w:r>`:""}<w:r>${rpr}<w:t xml:space="preserve">${xe(l)}</w:t></w:r>`).join("");
}
function para(text,{hiza,bold,size,sonra=80,girinti,asili}={}){
  const jc=hiza?`<w:jc w:val="${{left:"left",center:"center",right:"right",justify:"both"}[hiza]}"/>`:"";
  const ind=girinti?`<w:ind w:firstLine="709"/>`:asili?`<w:ind w:left="397" w:hanging="397"/>`:"";
  return `<w:p><w:pPr><w:spacing w:before="0" w:after="${sonra}"/>${ind}${jc}</w:pPr>${run(text,{bold,size})}</w:p>`;
}
let ICERIK_GEN=9638; // A4 - 2x2 cm kenar (twip); yatay sayfada 14570
function docxTablo(rows,{genislik,cerceve=true,baslikSatiri,size,plan}={}){
  const n=Math.max(...rows.map(r=>r.reduce((a,c)=>a+((c&&c.colspan)||1),0)));
  const gw=(genislik||Array(n).fill(100/n)).map(p=>Math.round(ICERIK_GEN*p/100));
  const kenar=cerceve?`<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join("")}</w:tblBorders>`
                     :`<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="nil"/>`).join("")}</w:tblBorders>`;
  let x=`<w:tbl><w:tblPr><w:tblW w:w="${ICERIK_GEN}" w:type="dxa"/><w:tblLayout w:type="fixed"/>${kenar}<w:tblCellMar><w:left w:w="70" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${gw.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`;
  rows.forEach((r,ri)=>{
    x+=`<w:tr>${plan?`<w:trPr><w:trHeight w:val="760"/><w:cantSplit/></w:trPr>`:`<w:trPr><w:cantSplit/></w:trPr>`}`;
    let ci=0;
    r.forEach(c=>{
      const o=(typeof c==="object"&&c)?c:{text:c};
      const span=o.colspan||1; const w=gw.slice(ci,ci+span).reduce((a,b)=>a+b,0); ci+=span;
      const bold=o.bold||(baslikSatiri&&ri===0);
      const shd=(o.dolgu||(baslikSatiri&&ri===0&&cerceve))?`<w:shd w:val="clear" w:color="auto" w:fill="E8E8E8"/>`:"";
      x+=`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span>1?`<w:gridSpan w:val="${span}"/>`:""}${shd}${plan?`<w:vAlign w:val="center"/>`:""}</w:tcPr>${para(o.text,{bold,size,sonra:0,hiza:o.hiza||(plan?"center":undefined)})}</w:tc>`;
    });
    x+=`</w:tr>`;
  });
  return x+`</w:tbl>`+para("",{sonra:60});
}
function docxGovde(bloklar){
  return bloklar.map(k=>{
    switch(k.t){
      case "baslik": return para(k.text,{hiza:"center",bold:true,sonra:0});
      case "p": return para(k.text,{hiza:k.hiza||"justify",bold:k.bold,girinti:k.girinti});
      case "h": return para(k.text,{bold:true,sonra:60}).replace("<w:spacing w:before=\"0\"","<w:spacing w:before=\"160\"");
      case "madde": return para(k.no+" "+k.text,{hiza:"justify",asili:true,sonra:40});
      case "bosluk": return para("",{sonra:120});
      case "sayfa": return `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
      case "tablo": return docxTablo(k.rows,{genislik:k.genislik,baslikSatiri:k.baslikSatiri,size:k.boyut||(k.plan?20:22),plan:k.plan});
      case "imza": return docxTablo(gruplu(k.kisiler,k.sutun).flatMap(r=>{ const rr=r.map(p=>({hiza:"center",text:[...(p.ust?[p.ust,p.alt||""]:[]),"",p.ad||"................",p.unvan||""].join("\n")})); while(rr.length<k.sutun) rr.push({text:""}); return [rr,Array(k.sutun).fill({text:" "})]; }),{cerceve:false});
    }
    return "";
  }).join("");
}
function docxXml(bloklar,{yatay}={}){
  ICERIK_GEN=yatay?16838-1134*2:9638;
  const pg=yatay?`<w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/>`:`<w:pgSz w:w="11906" w:h="16838"/>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${docxGovde(bloklar)}<w:sectPr>${pg}<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
}
const DOCX_SABIT={
"[Content_Types].xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`,
"_rels/.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
"word/_rels/document.xml.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
"word/styles.xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`
};
/* Basit ZIP yazıcı (sıkıştırmasız) */

async function zipOku(buf){
  const dv=new DataView(buf); let e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;

  const adet=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const dosyalar={}, dec=new TextDecoder();
  for(let i=0;i<adet;i++){
    const yontem=dv.getUint16(p+10,true), boy=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const ad=dec.decode(new Uint8Array(buf,p+46,nl));
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true);
    dosyalar[ad]={yontem,veri:new Uint8Array(buf,lho+30+lnl+lel,boy)};
    p+=46+nl+el+cl;
  }
  return dosyalar;
}

  if(!sayfa) throw new Error("sayfa yok");

    const satir=[];

      else if(v) deger=v.textContent;

    }
    sonuc[(+r.getAttribute("r")||sonuc.length+1)-1]=[...satir].map(x=>x??"");
  }
  for(let i=0;i<sonuc.length;i++) if(!sonuc[i]) sonuc[i]=[];
  /* birleştirilmiş hücreler: sol üst değeri tüm alana kopyala */
  const hc=ref=>{const m=ref.match(/^([A-Z]+)(\d+)$/); let c=0; for(const ch of m[1]) c=c*26+ch.charCodeAt(0)-64; return [ +m[2]-1, c-1 ];};

/* Word (.docx) içindeki tabloları oku: her tablo = satır dizisi. Dikey birleşik hücreler doldurulur. */
async function docxTablolar(buf){
  const z=await zipOku(buf), xml=await zipAc(z["word/document.xml"]);
  if(!xml) throw new Error("Word belgesi okunamadı");
  const d=new DOMParser().parseFromString(xml,"application/xml"), W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const cocuk=(el,ad)=>[...el.childNodes].filter(n=>n.localName===ad);
  const metin=tc=>{ const par=[]; for(const p of tc.getElementsByTagNameNS(W,"p")){ let t=""; for(const n of p.getElementsByTagNameNS("*","*")){ if(n.localName==="t") t+=n.textContent; else if(n.localName==="tab") t+=" "; else if(n.localName==="br") t+="\n"; } par.push(t); } return par.join("\n").replace(/[ \t]+/g," ").replace(/\n{2,}/g,"\n").trim(); };
  const tablolar=[];
  for(const tbl of d.getElementsByTagNameNS(W,"tbl")){
    if(tbl.parentNode&&tbl.parentNode.localName==="tc") continue; // iç içe tabloları atla
    const satirlar=[], ust=[];
    for(const tr of cocuk(tbl,"tr")){
      const satir=[]; let g=0;
      for(const tc of cocuk(tr,"tc")){
        const pr=cocuk(tc,"tcPr")[0]; const gs=pr&&cocuk(pr,"gridSpan")[0]; const span=gs?+gs.getAttributeNS(W,"val")||1:1;
        const vm=pr&&cocuk(pr,"vMerge")[0]; const devam=vm&&(vm.getAttributeNS(W,"val")||"continue")==="continue";
        const t=devam?(ust[g]??""):metin(tc);
        satir[g]=t; for(let k=1;k<span;k++) satir[g+k]="";
        ust[g]=t; g+=span;
      }

const PLAN_ALAN={ay:/^AY(LAR)?$/, hafta:/HAFTA/, saat:/SAAT|SURE/, tema:/TEMA|UNITE/, konu:/KONU|ICERIK/, cikti:/CIKTI|KAZANIM/, surec:/SUREC/, olcme:/OLCME|DEGERLENDIRME|KANIT/, belirli:/BELIRLI/};
function planAlanlari(basliklar){
  const n=basliklar.map(h=>normAnahtar(h).replace(/_/g," "));
  const m={}; for(const [k,re] of Object.entries(PLAN_ALAN)){ const i=n.findIndex((h,j)=>re.test(h)&&!Object.values(m).includes(j)); if(i>=0) m[k]=i; }
  return m;
}
function planCikar(tablolar){
  let bas=null, sat=[];
  for(const t of tablolar){
    for(let i=0;i<t.length;i++){
      const r=t[i]; if(!r.some(x=>x.trim())) continue;
      const m=planAlanlari(r);
      if(Object.keys(m).length>=3){ if(!bas) bas=r.map(x=>x.replace(/\s+/g," ").trim()); continue; }
      if(!bas) continue;
      sat.push(bas.map((_,j)=>(r[j]||"").trim()));
    }
  }
  if(!bas||!sat.length) return null;
  /* tamamen boş sütunları at */
  const dolu=bas.map((h,j)=>h||sat.some(r=>r[j]));
  bas=bas.filter((_,j)=>dolu[j]); sat=sat.map(r=>r.filter((_,j)=>dolu[j]));
  const alan=planAlanlari(bas);
  const satirlar=sat.map(r=>{ const farkli=new Set(r.filter(Boolean)); return {h:r,ara:farkli.size<=1}; });
  return {basliklar:bas,alan,satirlar};
}

  if(/\.docx$/i.test(ad)) return planCikar(await docxTablolar(buf));
  if(/\.xlsx$/i.test(ad)) return planCikar([await xlsxSatirlar(buf)]);

}
function csvSatirlar(metin){
  const ilk=metin.split(/\r?\n/).slice(0,5).join("\n");
  const ayr=[["\t",(ilk.match(/\t/g)||[]).length],[";",(ilk.match(/;/g)||[]).length],[",",(ilk.match(/,/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0];
  if(!ayr[1]) return metin.split(/\r?\n/).map(l=>[l]);
  const sonuc=[]; let satir=[], hucre="", tirnak=false;
  for(let i=0;i<metin.length;i++){

    if(tirnak){ if(c==='"'){ if(metin[i+1]==='"'){hucre+='"';i++;} else tirnak=false; } else hucre+=c; }
    else if(c==='"') tirnak=true;

}

function ogrenciCikar(rows){
  rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(Boolean));
  let bas=-1, cNo=-1, cAd=-1, cSoyad=-1, cCins=-1;
  for(let i=0;i<Math.min(rows.length,20)&&bas<0;i++){
    const r=rows[i].map(c=>normAnahtar(c));
    const ad=r.findIndex(c=>/^(OGRENCI(NIN)?_)?ADI?(_SOYADI?)?$|^AD_?SOYAD|^ADI_SOYADI$|^ISIM/.test(c));
    if(ad>=0){
      bas=i; cAd=ad;
      cNo=r.findIndex(c=>/(^|_)(NO|NUMARA(SI)?|OKUL_NO)$|^NO$|^NUMARA/.test(c));
      cSoyad=r.findIndex((c,j)=>j!==ad&&/^SOYAD/.test(c));
      cCins=r.findIndex(c=>/CINSIYET/.test(c));
    }
  }
  const liste=[];
  if(bas>=0){
    for(const r of rows.slice(bas+1)){
      let ad=(r[cAd]||"")+(cSoyad>=0&&r[cSoyad]?" "+r[cSoyad]:"");
      ad=ad.replace(/\s+/g," ").trim(); if(!ad||/^\d+$/.test(ad)) continue;
      liste.push({no:cNo>=0?String(r[cNo]||"").replace(/\.0$/,""):"",ad,cins:cCins>=0?cinsiyetOku(r[cCins]):""});
    }
  }else{
    for(const r of rows){
      if(r.length===1){ const o=satirdanOgrenci(r[0]); if(o) liste.push(o); continue; }
      let no="",cins="",ad=[];
      for(const c of r){ if(!c) continue; if(!no&&/^\d+(\.0)?$/.test(c)){no=c.replace(/\.0$/,"");continue;} const k=cinsiyetOku(c); if(k&&!cins){cins=k;continue;} if(/[a-zçğıöşü]/i.test(c)) ad.push(c); }
      if(ad.length&&no) liste.push({no,ad:ad.join(" ").replace(/\s+/g," "),cins});
    }
  }
  return liste;
}
function satirdanOgrenci(l){
  l=l.trim(); if(!l) return null;
  const m=l.match(/^(\d+)[\s.)\-:]+(.+?)(?:\s+(K|E|Kız|KIZ|Erkek|ERKEK))?$/);
  if(m) return {no:m[1],ad:m[2].trim(),cins:cinsiyetOku(m[3])};
  const m2=l.match(/^(.+?)(?:\s+(K|E|Kız|KIZ|Erkek|ERKEK))?$/);
  return {no:"",ad:m2[1].trim(),cins:cinsiyetOku(m2[2])};
}

/* =========================================================
   YILLIK PLAN / GÜNLÜK PLAN
   MEB'in yıllık plan dosyası (.zip / .docx / .xlsx) içe aktarılır,
   sınıf düzeyine göre (9, 10 ...) telefonda saklanır.
   ========================================================= */
const seviye = sube=>(String(sube||"").match(/\d+/)||[""])[0];
const sinifSecenek = ()=>(S.siniflar&&S.siniflar.length?S.siniflar:[S.okul.sube]);
function planGetir(sube){ return S.yillik[seviye(sube)]||null; }
function satirDeger(plan,r,k){ const i=plan.alan[k]; return i==null?"":(r.h[i]||""); }
function haftaEtiket(plan,r){
  const p=[satirDeger(plan,r,"ay"),satirDeger(plan,r,"hafta")].filter(Boolean).join(" · ").replace(/\n/g," ");
  const k=(satirDeger(plan,r,"konu")||satirDeger(plan,r,"tema")||satirDeger(plan,r,"cikti")).replace(/\n/g," ");
  return (p?p+" – ":"")+(k.length>55?k.slice(0,55)+"…":k);
}
function satirBaglam(plan,r){
  const d=k=>satirDeger(plan,r,k), saat=d("saat");
  return { AY:d("ay"), HAFTA:d("hafta").replace(/\n/g," "), TEMA:d("tema"), KONU:d("konu")||d("tema"), CIKTI:d("cikti"), SUREC:d("surec"),
           OLCME:d("olcme")||"Gözlem, soru-cevap, çalışma kâğıdı ve kısa değerlendirme etkinlikleriyle öğrenme kanıtları toplanır.",
           SURE:saat?(/^\d+$/.test(saat.trim())?saat.trim()+" ders saati":saat):"", BELIRLI:d("belirli") };
}
YER_TUTUCULAR.push("DERS","AY","HAFTA","TEMA","KONU","CIKTI","SUREC","OLCME","SURE");

/* İçe aktarma kutusu (yıllık ve günlük plan formlarında) */
function planKutusuCiz(v){
  const sube=v.sinif||sinifSecenek()[0], sv=seviye(sube), p=planGetir(sube);
  const say=p?p.satirlar.filter(r=>!r.ara).length:0;
  return `<div class="kart" style="background:#f7fafc;border:1px solid var(--cizgi);box-shadow:none;margin-top:12px">
    <h2 style="font-size:15px">${sv}. sınıf yıllık planı</h2>
    ${p?`<p>✅ Yüklü: <b>${say} hafta</b>${p.kaynak?` · ${esc(p.kaynak)}`:""}</p>`:`<p>Henüz yüklenmedi. MEB'in yıllık plan dosyasını seçin (.zip, .docx veya .xlsx). Zip dosyasını açmanıza gerek yok.</p>`}
    <div class="butonlar"><label class="btn ${p?"ikincil":""}" style="margin:0">📥 ${p?"Yeni dosya yükle":"MEB dosyasını seç"}<input type="file" data-plan-dosya accept=".zip,.docx,.xlsx,application/zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></label>
    ${p?`<button class="btn tehlike" data-plan-sil>Sil</button>`:""}</div>
    <div data-plan-secim></div>
  </div>`;
}
function planKutusuBagla(el,v,yenile){
  if(!el) return;
  const sube=v.sinif||sinifSecenek()[0], sv=seviye(sube);
  const kaydetPlan=(p,kaynak)=>{
    if(!p||!p.satirlar.length){ bildir("Bu dosyada yıllık plan tablosu bulunamadı. Başka bir dosya deneyin ya da dosyayı bana gönderin."); return; }
    p.kaynak=kaynak; S.yillik[sv]=p; kaydet(); bildir(`${sv}. sınıf planı yüklendi: ${p.satirlar.filter(r=>!r.ara).length} hafta`); yenile();
  };
  const sil=el.querySelector("[data-plan-sil]");
  if(sil) sil.onclick=()=>{ if(confirm(`${sv}. sınıf yıllık planı silinsin mi?`)){ delete S.yillik[sv]; kaydet(); yenile(); } };
  el.querySelector("[data-plan-dosya]").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return; e.target.value="";
    try{
      const buf=await f.arrayBuffer();
      if(/\.(docx|xlsx)$/i.test(f.name)) return kaydetPlan(await planDosyasiOku(f.name,buf),f.name);
      const z=await zipOku(buf);
      const adlar=Object.keys(z).filter(k=>/\.(docx|xlsx)$/i.test(k)&&!/(^|\/)(~\$|__MACOSX)/.test(k));
      if(!adlar.length){ bildir("Zip içinde Word veya Excel dosyası bulunamadı."); return; }
      const puan=k=>{ const n=normAnahtar(k.split("/").pop()); return (new RegExp("(^|[^0-9])"+sv+"([^0-9]|$)").test(n)?2:0)+(/ANADOLU/.test(n)?1:0)-(/FEN|SOSYAL|HAZIRLIK|TEMEL/.test(n)?1:0); };
      adlar.sort((a,b)=>puan(b)-puan(a));
      const kutu=el.querySelector("[data-plan-secim]");
      kutu.innerHTML=`<label>Zip içindeki dosyalar <small>(${sv}. sınıf için uygun olanı seçin)</small></label>`+adlar.map((k,i)=>`<button class="evrak" style="margin-top:6px" data-i="${i}"><b style="font-size:14px">${esc(k.split("/").pop())}</b>${i===0&&puan(k)>=2?`<span>Önerilen</span>`:""}</button>`).join("");
      kutu.querySelectorAll("[data-i]").forEach(b=>b.onclick=async()=>{
        const ad=adlar[+b.dataset.i];
        try{ const ic=await zipAcBayt(z[ad]); kaydetPlan(await planDosyasiOku(ad,ic.buffer.slice(ic.byteOffset,ic.byteOffset+ic.byteLength)),ad.split("/").pop()); }
        catch(err){ console.error(err); bildir("Dosya okunamadı: "+err.message); }
      });
    }catch(err){ console.error(err); bildir("Dosya okunamadı: "+err.message); }
  };
}
const planKutusu={id:"planDosya",tur:"ozel",ciz:planKutusuCiz,bagla:planKutusuBagla};
const sinifAlani={id:"sinif",ad:"Sınıf / şube",tur:"secim",secenek:sinifSecenek,v:()=>sinifSecenek()[0],yenidenCiz:true,sifirla:["hafta"]};

function yillikBelge(v,b){
  const p=planGetir(v.sinif);
  if(!p) return [...ustBaslik(b,"Yıllık plan"),B.p("Bu sınıf için yıllık plan yüklenmedi. Geri dönüp MEB dosyasını seçin.",{hiza:"center"})];
  const uz=p.basliklar.map((h,j)=>Math.min(60,Math.max(4,h.length*0.6,...p.satirlar.filter(r=>!r.ara).map(r=>Math.sqrt((r.h[j]||"").length)*3))));
  const top=uz.reduce((a,c)=>a+c,0), gen=uz.map(x=>x/top*100);
  const rows=[p.basliklar,...p.satirlar.map(r=>r.ara?[{text:r.h.find(Boolean)||"",colspan:p.basliklar.length,hiza:"center",bold:true,dolgu:true}]:r.h)];
  const uyeler=S.zumre.length?S.zumre:[b.OGRETMEN];
  return [
    ...B.baslik(BUYUK(`${b.YIL} eğitim-öğretim yılı ${b.OKUL||""}`), BUYUK(`${seviye(v.sinif)}. sınıf ${b.DERS} dersi ünitelendirilmiş yıllık planı`)),
    B.p(`Sınıf / Şube: ${v.sinif}`,{hiza:"left",bold:true}),
    B.tablo(rows,{baslikSatiri:true,genislik:gen,boyut:15}),
    B.bosluk(),
    B.imza([...uyeler.map(a=>({ad:a,unvan:`${b.DERS} Öğretmeni`})),{ust:"UYGUNDUR",alt:trTarih(v.tarih),ad:b.MUDUR||"................",unvan:"Okul Müdürü"}],Math.min(5,uyeler.length+1))
  ];
}

  giris:"Dersin öğrenme çıktıları öğrencilerle paylaşılır. Günlük hayattan bir problem durumu sunularak öğrencilerin ilgisi konuya çekilir.",
  islenis:"{KONU} örnekler üzerinden işlenir. Öğrenciler bireysel ve grup hâlinde etkinlikler yapar, çözüm yolları sınıfça tartışılır. Öğretmen süreç boyunca rehberlik eder ve geri bildirim verir.",
  sonuc:"Konu özetlenir, öğrencilerden öğrendiklerini kendi cümleleriyle ifade etmeleri istenir. Pekiştirme soruları çözülür ve ödev verilir.",
  olcme:"{OLCME}",
  zengin:"Konuyu kavrayan öğrencilere üst düzey düşünme gerektiren problemler ve araştırma görevleri verilir.",
  destek:"Desteğe ihtiyaç duyan öğrencilerle temel kavramlar somut örneklerle tekrar edilir, ek alıştırmalar yapılır.",
  yansitma:""
};
function gunlukTekPlan(v,b){
  const t=k=>doldur(v[k],b).trim()||"................................................";
  return [
    ...B.baslik(BUYUK(`${b.YIL} eğitim-öğretim yılı ${b.OKUL||""}`), BUYUK(`${b.DERS} dersi günlük ders planı`)),
    B.bosluk(),
    B.h("BÖLÜM I"),
    bilgiTablosu([["Ders",b.DERS],["Sınıf / Şube",b.SUBE],["Tarih",v.kapsam==="Tüm yıl"?(b.HAFTA||b.AY||""):`${b.TARIH} ${b.GUN}`],["Hafta",[b.AY,b.HAFTA].filter(Boolean).join(" · ")],["Süre",b.SURE||"...."],["Tema / Ünite",b.TEMA||"...."],["Konu / İçerik Çerçevesi",b.KONU||"...."]]),
    B.h("BÖLÜM II"),
    bilgiTablosu([["Öğrenme Çıktıları",b.CIKTI||"...."],...(b.SUREC?[["Süreç Bileşenleri",b.SUREC]]:[]),["Anahtar Kavramlar",t("kavram")],["Araç-Gereç ve Kaynaklar",t("arac")]]),
    B.h("BÖLÜM III: ÖĞRENME-ÖĞRETME SÜRECİ"),
    bilgiTablosu([["Ön Değerlendirme / Köprü Kurma",t("on")],["Giriş",t("giris")],["Geliştirme",t("islenis")],["Sonuç",t("sonuc")]]),
    B.h("BÖLÜM IV: ÖLÇME-DEĞERLENDİRME VE FARKLILAŞTIRMA"),
    bilgiTablosu([["Öğrenme Kanıtları",t("olcme")],["Zenginleştirme",t("zengin")],["Destekleme",t("destek")]]),
    B.h("BÖLÜM V: ÖĞRETMEN YANSITMALARI"),
    B.p(doldur(v.yansitma,b).trim()||Array(3).fill(".".repeat(90)).join("\n"),{hiza:"left"}),
    B.bosluk(),
    B.imza([{ad:b.OGRETMEN,unvan:`${b.DERS} Öğretmeni`},{ust:"UYGUNDUR",alt:v.kapsam==="Tüm yıl"?"..../..../20....":b.TARIH,ad:b.MUDUR||"................",unvan:"Okul Müdürü"}],2)
  ];
}
const gunlukMetinAlanlari=[
  ["kavram","Anahtar kavramlar"],["arac","Araç-gereç ve kaynaklar"],["on","Ön değerlendirme / köprü kurma"],["giris","Giriş"],["islenis","Geliştirme"],["sonuc","Sonuç"],
  ["olcme","Öğrenme kanıtları (ölçme-değerlendirme)"],["zengin","Farklılaştırma: zenginleştirme"],["destek","Farklılaştırma: destekleme"],["yansitma","Öğretmen yansıtmaları (boş bırakılırsa çizgi konur)"]
].map(([id,ad])=>({id,ad,tur:"metin",v:()=>GUNLUK_METIN[id]}));

const PLAN_EVRAKLARI={
  yillik:{
    ad:"Yıllık Plan", sim:"📅", acik:"MEB planından, sınıfa göre",
    yatay:()=>true,
    alanlar:[sinifAlani,{id:"tarih",ad:"Onay tarihi",tur:"date",v:bugun},planKutusu],
    belge:yillikBelge
  },
  gunluk:{
    ad:"Günlük Plan", sim:"🗓️", acik:"Yıllık plandaki haftadan",
    alanlar:[
      sinifAlani,
      {id:"kapsam",ad:"Ne hazırlansın?",tur:"secim",secenek:["Seçili hafta","Tüm yıl"],ipucu:"\"Tüm yıl\" her haftayı ayrı sayfada tek dosyada verir.",v:()=>"Seçili hafta"},
      {id:"hafta",ad:"Hafta",tur:"secim",secenek:v=>{ const p=planGetir(v.sinif); return p?p.satirlar.map((r,i)=>({d:String(i),e:haftaEtiket(p,r)})).filter((_,i)=>!p.satirlar[i].ara):[{d:"",e:"Önce yıllık planı yükleyin"}]; },
        v:x=>{ const p=planGetir(x.sinif); if(!p) return ""; const i=p.satirlar.findIndex(r=>!r.ara); return String(Math.max(0,i)); }},
      {id:"tarih",ad:"Tarih",tur:"date",v:bugun},
      planKutusu,
      ...gunlukMetinAlanlari
    ],
    belge(v,b){
      const p=planGetir(v.sinif);
      if(!p) return [...ustBaslik(b,"Günlük plan"),B.p("Bu sınıf için yıllık plan yüklenmedi. Geri dönüp MEB dosyasını seçin.",{hiza:"center"})];
      if(v.kapsam==="Tüm yıl"){
        const out=[]; p.satirlar.filter(r=>!r.ara).forEach((r,i)=>{ if(i) out.push(B.sayfa()); out.push(...gunlukTekPlan(v,{...b,...satirBaglam(p,r)})); });
        return out;
      }
      const r=p.satirlar[+v.hafta]||p.satirlar.find(x=>!x.ara);
      return gunlukTekPlan(v,{...b,...satirBaglam(p,r)});
    }
  }
};

Object.assign(EVRAKLAR, PLAN_EVRAKLARI);
const EVRAK_SIRASI=["yillik","gunluk","sok","zumre","veli","rehberlik","oturma"];

/* =========================================================
   EKRANLAR
   ========================================================= */
let geriFn=null;
function ekran(baslik,html,{geri}={}){
  $("#baslik").textContent=baslik; $("#ekran").innerHTML=html; window.scrollTo(0,0);
  geriFn=geri||null; $("#geri").hidden=!geri;
}
$("#geri").onclick=()=>geriFn&&geriFn();

function anaSayfa(){
  if(!S.kurulumTamam) return kurulum(true);
  const o=S.okul;
  ekran("Evrak Defterim",`
    <div class="kart"><h2>${esc(o.okul||"Okulunuz")}</h2><p>${esc(o.ogretmen)} · ${esc(o.brans)} · ${esc(o.sube)} rehber öğretmeni · ${S.ogrenciler.length} öğrenci · ${esc(o.yil)}</p></div>
    <div class="izgara">${EVRAK_SIRASI.map(id=>[id,EVRAKLAR[id]]).map(([id,e])=>`<button class="evrak" data-ev="${id}"><span class="sim">${e.sim}</span><b>${e.ad}</b><span>${e.acik}</span></button>`).join("")}</div>
    <div class="butonlar"><button class="btn ikincil" id="ayar">⚙️ Bilgilerim</button><button class="btn ikincil" id="yedek">💾 Yedek</button></div>
    <p class="ipucu" style="text-align:center;margin-top:16px">Tüm bilgiler yalnızca bu telefonda saklanır.</p>`);
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>evrakForm(b.dataset.ev));
  $("#ayar").onclick=()=>kurulum(false); $("#yedek").onclick=yedekEkrani;
}

function kurulum(ilk){
  const o=S.okul, alan=(id,ad,ph="")=>`<label>${ad}</label><input id="k_${id}" value="${esc(o[id])}" placeholder="${esc(ph)}">`;
  ekran(ilk?"Hoş geldiniz":"Bilgilerim",`
    ${ilk?`<div class="kart"><h2>Bir kez doldurun</h2><p>Bu bilgiler tüm evraklara otomatik yazılır. Sonra istediğiniz zaman değiştirebilirsiniz.</p></div>`:""}
    <div class="kart"><h2>Okul</h2>
      ${alan("okul","Okul adı","Örn. Atatürk Anadolu Lisesi")}
      <div class="satir"><div>${alan("il","İl")}</div><div>${alan("ilce","İlçe")}</div></div>
      ${alan("yil","Eğitim-öğretim yılı")}
      ${alan("mudur","Okul müdürü")}
      ${alan("mudurYrd","Müdür yardımcısı")}
      ${alan("rehber","Okul rehber öğretmeni (psikolojik danışman)")}
    </div>
    <div class="kart"><h2>Siz</h2>
      ${alan("ogretmen","Adınız soyadınız")}
      <div class="satir"><div>${alan("brans","Branş")}</div><div>${alan("sube","Rehberi olduğunuz şube")}</div></div>
      <label>Derse girdiğiniz sınıflar <small>(her satıra bir şube; yıllık ve günlük plan için)</small></label>
      <textarea id="k_siniflar" style="min-height:70px" placeholder="9/C&#10;10/C">${esc((S.siniflar||[]).join("\n"))}</textarea>
    </div>
    <div class="kart"><h2>Zümre öğretmenleri</h2>
      <label>Her satıra bir öğretmen <small>(kendiniz dahil; ilk yazılan zümre başkanı)</small></label>
      <textarea id="k_zumre" placeholder="Ayşe Yılmaz&#10;Mehmet Demir">${esc(S.zumre.join("\n"))}</textarea>
    </div>
    <div class="kart"><h2>Şubede ders veren öğretmenler</h2>
      <label>Her satır: Ders: Ad Soyad <small>(ŞÖK tutanağı için)</small></label>
      <textarea id="k_subeOg" placeholder="Türk Dili ve Edebiyatı: Ali Kaya&#10;Fizik: Zeynep Ak">${esc(S.subeOgretmen.map(x=>`${x.ders}: ${x.ad}`).join("\n"))}</textarea>
    </div>
    <div class="kart"><h2>Öğrenci listesi <span class="sayac" id="sayac"></span></h2>
      <p>Excel (.xlsx) veya CSV dosyası seçin, ya da listeyi aşağıya yapıştırın. Her satır: <b>No Ad Soyad K/E</b></p>
      <div class="butonlar"><label class="btn ikincil" style="margin:0">📄 Excel / CSV seç<input type="file" id="dosya" accept=".xlsx,.csv,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></label></div>
      <textarea id="k_ogr" class="uzun" placeholder="101 Ali Yılmaz E&#10;102 Ayşe Kaya K">${esc(ogrenciMetni(S.ogrenciler))}</textarea>
      <p class="ipucu">e-Okul'dan indirdiğiniz dosya .xls ise: Google E-Tablolar veya Excel uygulamasında açıp .xlsx olarak kaydedin, ya da isimleri kopyalayıp buraya yapıştırın.</p>
    </div>
    <div style="height:10px"></div>
    <div class="alt"><button class="btn tam" id="kaydetBtn">${ilk?"Kaydet ve başla":"Kaydet"}</button></div>
  `,{geri:ilk?null:anaSayfa});
  const say=()=>{ $("#sayac").textContent=satirlar($("#k_ogr").value).length+" öğrenci"; };
  say(); $("#k_ogr").oninput=say;
  $("#dosya").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const buf=await f.arrayBuffer(); let rows;
      if(/\.xls$/i.test(f.name)) { bildir("Eski .xls biçimi okunamıyor. Lütfen .xlsx veya CSV olarak kaydedin."); return; }
      if(/\.xlsx$/i.test(f.name)||new Uint8Array(buf,0,2).join()==="80,75") rows=await xlsxSatirlar(buf);
      else { let t; try{ t=new TextDecoder("utf-8",{fatal:true}).decode(buf);}catch(_){ t=new TextDecoder("windows-1254").decode(buf);} rows=csvSatirlar(t.replace(/^﻿/,"")); }
      const liste=ogrenciCikar(rows);
      if(!liste.length){ bildir("Dosyada öğrenci bulunamadı. Listeyi kopyalayıp yapıştırmayı deneyin."); return; }
      $("#k_ogr").value=ogrenciMetni(liste); say(); bildir(liste.length+" öğrenci aktarıldı. Kontrol edip Kaydet'e basın.");
    }catch(err){ console.error(err); bildir("Dosya okunamadı: "+err.message); }
    e.target.value="";
  };
  $("#kaydetBtn").onclick=()=>{
    for(const k of Object.keys(BOS.okul)) S.okul[k]=$("#k_"+k).value.trim();
    S.zumre=satirlar($("#k_zumre").value);
    S.siniflar=satirlar($("#k_siniflar").value);
    S.subeOgretmen=satirlar($("#k_subeOg").value).map(l=>{const i=l.indexOf(":"); return i>0?{ders:l.slice(0,i).trim(),ad:l.slice(i+1).trim()}:{ders:"",ad:l};});
    const ham=satirlar($("#k_ogr").value), liste=ham.length&&ham.some(l=>/[\t;]/.test(l))?ogrenciCikar(csvSatirlar(ham.join("\n"))):ham.map(satirdanOgrenci).filter(Boolean);
    S.ogrenciler=liste;
    if(!S.okul.ogretmen){ bildir("Lütfen adınızı yazın."); return; }
    S.kurulumTamam=true; kaydet(); bildir("Kaydedildi"); anaSayfa();
  };
}

/* ---------- evrak formu ---------- */
function alanSecenek(a,v){ return typeof a.secenek==="function"?a.secenek(v||{}):a.secenek; }
function evrakForm(id){
  const ev=EVRAKLAR[id];
  const kayit=S.kayitlar[id]||{degerler:{},degisen:[]};
  const v=Object.assign({},kayit.degerler), degisen=new Set(kayit.degisen||[]);
  const sablon=S.sablonlar[id]||{};
  const anahtar=a=>id==="zumre"?a.id+"|"+v.toplanti:a.id;
  const varsayilan=a=>(a.tur==="metin"&&sablon[anahtar(a)]!=null)?sablon[anahtar(a)]:(a.v?a.v(v):"");
  function yenile(){ for(const a of ev.alanlar){ if(a.tur==="plan"||a.tur==="ozel") continue; if(!degisen.has(a.id)||v[a.id]==null) v[a.id]=varsayilan(a); } }
  yenile();
  const alanHtml=a=>{
    if(a.tur==="plan") return `<div class="kart" id="planKart"></div>`;
    if(a.tur==="ozel") return `<div data-ozel="${a.id}">${a.ciz(v)}</div>`;
    const ip=a.ipucu?`<div class="ipucu">${a.ipucu}</div>`:"";
    let g;
    if(a.tur==="secim") g=`<select data-a="${a.id}">${alanSecenek(a,v).map(s=>{const d=typeof s==="object"?s.d:s, e=typeof s==="object"?s.e:s; return `<option value="${esc(d)}" ${String(d)===String(v[a.id])?"selected":""}>${esc(e)}</option>`;}).join("")}</select>${ip}`;
    else if(a.tur==="metin") g=`<textarea data-a="${a.id}" class="${a.uzun?"uzun":""}">${esc(v[a.id])}</textarea>${ip}<div class="ipucu"><button class="btn ikincil" style="padding:6px 10px;font-size:13px;margin-top:4px" data-sablon="${a.id}">Bu metni şablonum yap</button> <button class="btn ikincil" style="padding:6px 10px;font-size:13px;margin-top:4px" data-sifirla="${a.id}">Varsayılana dön</button></div>`;
    else g=`<input data-a="${a.id}" type="${a.tur==="number"?"number":a.tur}" inputmode="${a.tur==="number"?"numeric":"text"}" value="${esc(v[a.id])}">${ip}`;
    return `<label>${a.ad}</label>${g}`;
  };
  ekran(ev.ad,`
    <div class="kart">${ev.alanlar.filter(a=>a.tur!=="plan").map(alanHtml).join("")}
      <details><summary>Kullanılabilir yer tutucular</summary><div class="ipucu">Metinlere yazdığınız bu etiketler belgede otomatik doldurulur:<br>${YER_TUTUCULAR.map(k=>`<span class="etiket">{${k}}</span>`).join("")}</div></details>
    </div>
    ${ev.alanlar.some(a=>a.tur==="plan")?`<div class="kart" id="planKart"></div>`:""}
    <div style="height:10px"></div>
    <div class="alt"><button class="btn ikincil" id="sifirlaHepsi">Sıfırla</button><button class="btn" id="onizle">Önizle ve indir</button></div>
  `,{geri:()=>{sakla();anaSayfa();}});
  function sakla(){ S.kayitlar[id]={degerler:v,degisen:[...degisen]}; kaydet(); }
  const kap=$("#ekran");
  for(const a of ev.alanlar) if(a.tur==="ozel"&&a.bagla) a.bagla(kap.querySelector(`[data-ozel="${a.id}"]`),v,()=>{sakla();evrakForm(id);});
  kap.oninput=e=>{
    const a=e.target.dataset.a; if(!a) return;
    v[a]=e.target.value; degisen.add(a);
    const alan=ev.alanlar.find(x=>x.id===a);
    if(alan&&alan.yenidenCiz){ (alan.sifirla||[]).forEach(x=>degisen.delete(x)); sakla(); evrakForm(id); return; }
    if(e.target.tagName==="SELECT"){ if(id==="zumre"&&a==="toplanti"){ ["gundem","gorusme","karar"].forEach(x=>degisen.delete(x)); } yenile(); evrakFormYenile(); }
    if(id==="zumre"&&a==="gundem"&&!degisen.has("gorusme")&&sablon[anahtar({id:"gorusme"})]==null){ v.gorusme=gorusmeOtomatik(v.gundem); const t=kap.querySelector('[data-a="gorusme"]'); if(t) t.value=v.gorusme; }
    if(id==="oturma"&&["sira","sutun","kisi","duzen"].includes(a)){ v.planDizi=null; planCiz(); }
    sakla();
  };
  function evrakFormYenile(){ for(const el of kap.querySelectorAll("[data-a]")) if(el.value!==v[el.dataset.a]) el.value=v[el.dataset.a]??""; }
  kap.onclick=e=>{
    const s=e.target.dataset.sablon, r=e.target.dataset.sifirla;
    if(s){ S.sablonlar[id]=S.sablonlar[id]||{}; S.sablonlar[id][anahtar({id:s})]=v[s]; kaydet(); bildir("Şablon kaydedildi. Bundan sonra bu metinle başlar."); }
    if(r){ if(S.sablonlar[id]) delete S.sablonlar[id][anahtar({id:r})]; degisen.delete(r); const a=ev.alanlar.find(x=>x.id===r); v[r]=a.v?a.v(v):""; kap.querySelector(`[data-a="${r}"]`).value=v[r]; sakla(); kaydet(); bildir("Varsayılan metne dönüldü."); }
  };
  $("#sifirlaHepsi").onclick=()=>{ if(!confirm("Bu evraktaki tüm değişiklikler silinsin mi?")) return; delete S.kayitlar[id]; kaydet(); evrakForm(id); };
  $("#onizle").onclick=()=>{ sakla(); onizleme(id,v); };

  /* oturma planı düzenleyici */
  let secili=null;
  function planOlustur(){
    const kisiSay=(+v.sira||1)*(+v.sutun||1)*(+v.kisi||2);
    let l=[...S.ogrenciler];
    const trc=(a,b)=>a.ad.localeCompare(b.ad,"tr");
    if(v.duzen==="Alfabetik") l.sort(trc);
    else if(v.duzen==="Rastgele"||v.duzen==="Kız-erkek karışık"){ for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]];} }
    else l.sort((a,b)=>(+a.no||0)-(+b.no||0));
    if(v.duzen==="Kız-erkek karışık"){ const k=l.filter(o=>o.cins==="K"), e=l.filter(o=>o.cins!=="K"), m=[]; while(k.length||e.length){ if(e.length) m.push(e.shift()); if(k.length) m.push(k.shift()); } l=m; }
    const d=Array(kisiSay).fill(""); l.slice(0,kisiSay).forEach((o,i)=>d[i]=o.no+"|"+o.ad); v.planDizi=d;
    if(l.length>kisiSay) bildir(`Dikkat: ${l.length-kisiSay} öğrenciye yer kalmadı. Sıra sayısını artırın.`);
  }
  function planCiz(){
    const pk=$("#planKart"); if(!pk) return;
    const kisiSay=(+v.sira||1)*(+v.sutun||1)*(+v.kisi||2);
    if(!v.planDizi||v.planDizi.length!==kisiSay) planOlustur();
    const harita=Object.fromEntries(S.ogrenciler.map(o=>[o.no+"|"+o.ad,o]));
    let h=`<h2>Yerleşim</h2><p>Yer değiştirmek için iki öğrenciye sırayla dokunun.</p><div class="plan-duz"><div class="tahta">TAHTA</div>`;
    for(let r=0;r<(+v.sira||1);r++){
      h+=`<div style="display:flex;gap:6px">`;
      for(let c=0;c<(+v.sutun||1);c++){
        h+=`<div class="sira" style="flex:1">`;
        for(let k=0;k<(+v.kisi||2);k++){ const i=(r*(+v.sutun||1)+c)*(+v.kisi||2)+k, o=harita[v.planDizi[i]]; h+=`<button class="koltuk ${o?"":"bos"} ${secili===i?"secili":""}" data-k="${i}">${o?esc(o.ad):"boş"}</button>`; }
        h+=`</div>`;
      }
      h+=`</div>`;
    }
    h+=`</div><div class="butonlar"><button class="btn ikincil" id="yenidenDiz">🔀 Yeniden yerleştir</button></div>`;
    pk.innerHTML=h;
    pk.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.k; if(secili==null) secili=i; else { [v.planDizi[secili],v.planDizi[i]]=[v.planDizi[i],v.planDizi[secili]]; secili=null; sakla(); } planCiz(); });
    $("#yenidenDiz").onclick=()=>{ planOlustur(); secili=null; sakla(); planCiz(); };
  }
  if(id==="oturma"){ if(!S.ogrenciler.length) bildir("Önce Bilgilerim'den öğrenci listesini girin."); planCiz(); }
}

/* ---------- önizleme ve çıktı ---------- */
function onizleme(id,v){
  const ev=EVRAKLAR[id], b=baglam(v), bloklar=ev.belge(v,b), yatay=!!(ev.yatay&&ev.yatay(v));
  const ad=dosyaAdi(`${ev.ad}_${v.sinif||S.okul.sube}_${v.tarih||bugun()}`);
  ekran("Önizleme",`
    <div class="kart yazdirma-yok"><p>Belgeyi kontrol edin. Word dosyasını telefonda Word, Google Dokümanlar veya WPS ile açıp düzenleyebilirsiniz.</p></div>
    <div class="kagit-kap"><div class="kagit${yatay?" yatay":""}" id="kagit">${htmlCiz(bloklar)}</div></div>
    <div style="height:10px"></div>
    <div class="alt"><button class="btn" id="word">📝 Word</button><button class="btn" id="pdf">📄 PDF</button><button class="btn ikincil" id="paylas">📤 Paylaş</button></div>
  `,{geri:()=>evrakForm(id)});
  const blob=()=>docxBlob(bloklar,{yatay});
  $("#word").onclick=()=>indir(blob(),ad+".docx");
  $("#pdf").onclick=()=>{ bildir("Yazdır ekranında 'PDF olarak kaydet'i seçin."); let st=document.getElementById("sayfaYonu"); if(!st){st=document.createElement("style");st.id="sayfaYonu";document.head.appendChild(st);} st.textContent=`@media print{@page{size:A4 ${yatay?"landscape":"portrait"};margin:${yatay?"10mm":"15mm"}}}`; setTimeout(()=>window.print(),400); };
  $("#paylas").onclick=async()=>{
    const f=new File([blob()],ad+".docx",{type:blob().type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title:ev.ad}); }catch(e){} }
    else { indir(f,ad+".docx"); bildir("Paylaşım desteklenmiyor, dosya indirildi."); }
  };
}
function indir(blob,ad){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=ad; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); bildir("İndirildi: "+ad); }

/* ---------- yedekleme ---------- */
function yedekEkrani(){
  ekran("Yedek",`
    <div class="kart"><h2>Yedek al</h2><p>Tüm bilgilerinizi (okul, öğrenciler, şablonlar) tek dosyaya kaydeder. Telefon değiştirirken veya uygulamayı silmeden önce yedek alın.</p>
      <div class="butonlar"><button class="btn" id="yedekAl">💾 Yedek dosyası indir</button></div></div>
    <div class="kart"><h2>Yedekten geri yükle</h2><p>Daha önce aldığınız yedek dosyasını seçin. Mevcut bilgilerin yerine geçer.</p>
      <div class="butonlar"><label class="btn ikincil" style="margin:0">📂 Yedek dosyası seç<input type="file" id="yedekYukle" accept=".json,application/json" hidden></label></div></div>
    <div class="kart"><h2>Her şeyi sil</h2><p>Bu telefondaki tüm bilgileri siler.</p>
      <div class="butonlar"><button class="btn tehlike" id="sil">Tüm verileri sil</button></div></div>
  `,{geri:anaSayfa});
  $("#yedekAl").onclick=()=>indir(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),`evrak-yedek-${bugun()}.json`);
  $("#yedekYukle").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(!d.okul) throw 0; S=Object.assign(structuredClone(BOS),d); kaydet(); bildir("Yedek yüklendi."); anaSayfa(); }catch(_){ bildir("Bu dosya geçerli bir yedek değil."); } };
  $("#sil").onclick=()=>{ if(confirm("Tüm bilgiler silinsin mi? Bu geri alınamaz.")){ localStorage.removeItem(ANAHTAR); S=structuredClone(BOS); anaSayfa(); } };
}

/* ---------- PWA: çevrimdışı çalışma ve ana ekrana ekleme ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
let kurulumIstegi=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); kurulumIstegi=e; $("#yukleBtn").hidden=false; });
$("#yukleBtn").onclick=async()=>{ if(!kurulumIstegi) return; kurulumIstegi.prompt(); await kurulumIstegi.userChoice; kurulumIstegi=null; $("#yukleBtn").hidden=true; };
window.addEventListener("appinstalled",()=>{ $("#yukleBtn").hidden=true; bildir("Uygulama ana ekrana eklendi."); });

anaSayfa();
</script>
